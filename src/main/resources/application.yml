spring:
  application:
    name: anime-catalog
  datasource:
    # url: ${DB_URL:jdbc:postgresql://localhost:5432/anime_catalog}
    # username: ${DB_USERNAME:postgres}
    # password: ${DB_PASSWORD:postgres}
    url: jdbc:postgresql://localhost:5432/anime_catalog
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: mappings
